version: 2.1
jobs:
  compile:
    docker:
      - image: wizardprjkt/build:kernel
    steps:
      - run:
          shell: /bin/bash
          command: |
            git clone --depth=1 https://github.com/Tiktodz/android_kernel_asus_sdm636 -b cip kernel
            curl -s -L https://raw.githubusercontent.com/texascake/cooking-kernel/cip/build.sh | bash
          no_output_timeout : 30m
workflows:
  version: 2.1
  cooking:
    jobs:
      - compile
