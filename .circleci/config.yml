version: 2.1
jobs:
  compile:
    docker:
      - image: inok2341/anu:latest
    steps:
      - run:
          shell: /bin/bash
          command: |
            git clone --depth=1 https://$AWAL:$AKHIR@github.com/Tiktodz/android_kernel_asus_sdm636 -b caf kernel
            curl -s -L https://raw.githubusercontent.com/texascake/cooking-kernel/4.4/build.sh | bash
          no_output_timeout : 1h
workflows:
  version: 2.1
  cooking:
    jobs:
      - compile
