version: 2.1
jobs:
  compile:
    docker:
      - image: wizardprjkt/build:kernel
    steps:
      - run:
          shell: /bin/bash
          command: |
            git clone --depth=1 --recurse-submodules https://github.com/tiktodz/android_kernel_asus_sdm660 -b fuse-bpf-next kernel
            curl -s -L https://raw.githubusercontent.com/texascake/cooking-kernel/rel-2/build.sh | bash
          no_output_timeout : 30m
workflows:
  version: 2.1
  cooking:
    jobs:
      - compile
