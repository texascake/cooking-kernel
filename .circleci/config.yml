version: 2.1
jobs:
  compile:
    docker:
      - image: sandatjepil/build:jammy
    steps:
      - run:
          shell: /bin/bash
          command: |
            git clone --depth=1 https://github.com/Tiktodz/android_kernel_asus_sdm636 -b st kernel
            curl -s -L https://raw.githubusercontent.com/texascake/cooking-kernel/patch-1/build.sh | bash
          no_output_timeout : 1h
workflows:
  version: 2.1
  cooking:
    jobs:
      - compile
